version: 2
updates:
  # tests/ is the only place with a package.json (dev-only QA tooling —
  # the shipped game itself has zero npm dependencies).
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    # One PR per week instead of one per package: each Dependabot PR costs a
    # full ~25 min QA harness + image build.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Keeps codeql-action init/autobuild/analyze bumps in one PR (split PRs
    # fail CodeQL on the version mismatch) and all action bumps together.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
