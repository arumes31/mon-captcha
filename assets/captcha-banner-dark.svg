<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 90" width="316" height="90" role="img" aria-labelledby="t">
  <title id="t">I'm not a robot — Monster CAPTCHA</title>
  <!--
    Dark-theme twin of captcha-banner.svg — the control embed/monster-captcha.js
    renders for data-theme="dark". Keep the two in step; only the palette
    differs (geometry is identical). The checkbox stays white on both themes,
    matching the widget.

      card   #20242b on #3a4049
      label  #e8eaed
      mark   shell #5b4a3d, ring #2a2f36
      brand  wordmark #b9c0cb, legal #79818e
  -->
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="6.5" y="6.5" width="303" height="77" rx="3" fill="#20242b" stroke="#3a4049" stroke-width="1" filter="url(#s)"/>

  <!-- unchecked box -->
  <rect x="19" y="32" width="26" height="26" rx="2" fill="#ffffff" stroke="#b0b6be" stroke-width="2"/>

  <!-- label -->
  <text x="58" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e8eaed">I'm not a robot</text>

  <!-- brand column: capture-ball mark, wordmark, legal line -->
  <g transform="translate(248,12)">
    <circle cx="16" cy="18" r="11" fill="#5b4a3d"/>
    <path d="M16 7.5 v21" stroke="#d9a441" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="16" cy="18" r="11" fill="none" stroke="#2a2f36" stroke-width="1.4"/>
    <rect x="12.6" y="3.4" width="6.8" height="6.2" rx="1.5" fill="#ffd77a" stroke="#b9832c" stroke-width="1.2"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="264" y="55" font-size="10" font-weight="700" fill="#b9c0cb">Monster</text>
    <text x="264" y="66" font-size="10" font-weight="700" fill="#b9c0cb">CAPTCHA</text>
    <text x="264" y="77" font-size="9" fill="#79818e">Privacy - Terms</text>
  </g>
</svg>
